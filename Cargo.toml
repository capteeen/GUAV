[workspace]
members = ["programs/*"]
resolver = "2"

# Cargo.lock pins some crates so Solana platform-tools cargo 1.84 can parse them.
# Do not cargo update those pins onto edition-2024 releases.

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
